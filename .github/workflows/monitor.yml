name: Options Monitor

on:
  workflow_dispatch:

  schedule:
    # 한국시간 평일 밤 10시~다음날 오전 6시 30분, 30분 간격
    - cron: "0,30 13-21 * * 1-5"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 옵션 데이터 수집
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/monitor.py

      - name: 결과 저장
        run: |
          git config user.name "options-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "옵션 데이터 자동 업데이트"
          git push
